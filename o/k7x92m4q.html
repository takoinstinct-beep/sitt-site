<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ست — لوحة المالكين</title>
<link rel="stylesheet" href="../assets/css/style.css?v=9">
<style>
body{background:#f5efe6}
.ad{max-width:1000px;margin:0 auto;padding:18px 16px 60px;color:#3a2a2a}
.ad h1{font-size:26px;margin:6px 0 14px;color:#6b2a37}
.ad-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ad-bar button,.ad-btn{padding:9px 14px;border:1px solid #b8923f;background:#fbf6ec;color:#6b2a37;font:inherit;font-size:14px;cursor:pointer}
.ad-bar button.on{background:#6b2a37;color:#f5efe6}
.demo-flag{background:#b8923f;color:#fff;padding:4px 10px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.kc{border:1px solid #cba85e88;background:#fbf6ec;padding:14px}
.kc b{display:block;font-size:22px;color:#6b2a37;margin-top:4px}
.kc span{font-size:12px;color:#7d7268}
.box{border:1px solid #cba85e88;background:#fbf6ec;padding:14px;margin:12px 0}
.box h3{margin:0 0 10px;font-size:16px;color:#6b2a37}
.bar{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.bar i{display:block;height:12px;background:#b8923f}
.bar em{font-style:normal;text-align:left}
.ord{border:1px solid #cba85e88;background:#fbf6ec;padding:12px;margin:10px 0;font-size:14px}
.ord h4{margin:0 0 6px;font-size:15px}
.ord select,.ord input,.fi input,.fi select{padding:8px;border:1px solid #cba85e;background:#fff;font:inherit;font-size:14px;max-width:100%}
.fi{display:grid;gap:10px;max-width:360px;margin:30px auto}
.fi input{text-align:left}
.msg{color:#a33;font-size:13px}
.rowf{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="ad" id="app"></div>
<script>
(function(){
var API='https://sitt-site-eosin.vercel.app', app=document.getElementById('app');
var tok=sessionStorage.getItem('sitt_t')||'', demo=false, view='dash';
var ST={new:'جديد',confirmed:'مؤكد',shipped:'اتشحن',delivered:'اتسلّم',cancelled:'ملغي'};
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n(x){return Math.round(x).toLocaleString('en-US')}
function call(act,method,body,qs){
  return fetch(API+'/api/admin?action='+act+(qs||''),{method:method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:method==='POST'?JSON.stringify(body||{}):undefined})
   .then(function(r){if(r.status===401&&act!=='login'){logout();throw new Error('auth')}return r.json().then(function(j){j._s=r.status;return j})});
}
function logout(){tok='';sessionStorage.removeItem('sitt_t');login()}
function login(msg){
  app.innerHTML='<h1>لوحة المالكين</h1><form class="fi" id="lf"><input id="em" type="email" dir="ltr" placeholder="الإيميل" autocomplete="username" required><input id="pw" type="password" dir="ltr" placeholder="كلمة السر" autocomplete="current-password" required><button class="btn" type="submit">دخول</button><button type="button" class="ad-btn" id="dd">شوفي نسخة تجريبية (بيانات مش حقيقية)</button><div class="msg">'+(msg||'')+'</div></form>';
  document.getElementById('dd').onclick=function(){demo=true;shell()};
  document.getElementById('lf').onsubmit=function(e){e.preventDefault();
    fetch(API+'/api/admin?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('em').value,password:document.getElementById('pw').value})})
    .then(function(r){return r.json().then(function(j){return [r.status,j]})}).then(function(a){
      if(a[0]===200){tok=a[1].token;sessionStorage.setItem('sitt_t',tok);shell()}
      else login(a[0]===429?'محاولات كتير. استني شوية وجربي تاني.':'الإيميل أو كلمة السر غلط.')
    }).catch(function(){login('مشكلة في الاتصال.')});
  };
}
function demoData(){
  var P=[['malika','شميز اللفّة الذهبية',950],['shams','بلوزة جرس اللوتس',650],['oud','بلوزة العود الذهبي',950]],C=['برجندي','أسود','كريمي'],S=['S','M','L','XL'],SS=['new','confirmed','shipped','delivered','delivered','delivered','cancelled'];
  var seed=7;function r(){seed=(seed*9301+49297)%233280;return seed/233280}
  var os=[];for(var i=0;i<60;i++){var p=P[Math.floor(r()*3)],q=1+Math.floor(r()*2),d=new Date(Date.now()-r()*150*864e5);
   os.push({orderNo:'DEMO-'+(1001+i),createdAt:d.toISOString(),status:SS[Math.floor(r()*SS.length)],courierNo:'',total:p[2]*q,items:[{id:p[0],name:p[1],color:C[Math.floor(r()*3)],size:S[Math.floor(r()*4)],qty:q,unitPrice:p[2],unitCost:p[2]*0.45}],customer:{name:'عميلة تجريبية',phone:'010xxxxxxxx'},shipping:{governorate:'القاهرة',address:'—'},payment:{method:'cod',status:'pending'}})}
  return os;
}
function statsFrom(os,from,to){
  var o={count:0,revenue:0,cost:0,gatewayFees:0,shippingCost:0,profit:0,funnel:{},cancelled:0,byProduct:{},byColor:{},bySize:{},byMonth:{}};
  os.forEach(function(x){var t=x.createdAt.slice(0,10);if(from&&t<from)return;if(to&&t>to)return;
   o.funnel[x.status]=(o.funnel[x.status]||0)+1;if(x.status==='cancelled'){o.cancelled++;return}
   var c=x.items.reduce(function(s,i){return s+i.qty*(i.unitCost||0)},0);o.count++;o.revenue+=x.total;o.cost+=c;
   var m=x.createdAt.slice(0,7),mm=o.byMonth[m]||(o.byMonth[m]={revenue:0,profit:0,orders:0});mm.revenue+=x.total;mm.orders++;mm.profit+=x.total-c;
   x.items.forEach(function(i){var p=o.byProduct[i.id]||(o.byProduct[i.id]={name:i.name,qty:0,revenue:0});p.qty+=i.qty;p.revenue+=i.qty*i.unitPrice;o.byColor[i.color]=(o.byColor[i.color]||0)+i.qty;o.bySize[i.size]=(o.bySize[i.size]||0)+i.qty})});
  o.profit=o.revenue-o.cost-o.gatewayFees-o.shippingCost;return o;
}
function bars(obj,fmt){var k=Object.keys(obj),mx=Math.max.apply(null,k.map(function(x){return obj[x].v}).concat([1]));
  return k.map(function(x){return '<div class="bar"><span>'+esc(obj[x].l||x)+'</span><span><i style="width:'+Math.max(3,obj[x].v/mx*100)+'%"></i></span><em>'+(fmt?fmt(obj[x].v):n(obj[x].v))+'</em></div>'}).join('')||'<p class="msg" style="color:#7d7268">مفيش بيانات.</p>';
}
function shell(){
  app.innerHTML='<h1>لوحة المالكين</h1><div class="ad-bar"><button data-v="dash" class="'+(view==='dash'?'on':'')+'">الأرقام</button><button data-v="orders" class="'+(view==='orders'?'on':'')+'">الطلبات</button><button data-v="rets" class="'+(view==='rets'?'on':'')+'">طلبات الاسترجاع</button><button data-v="subs" class="'+(view==='subs'?'on':'')+'">المشتركين</button><button data-v="prods" class="'+(view==='prods'?'on':'')+'">المنتجات</button><button data-v="cost" class="'+(view==='cost'?'on':'')+'">التكلفة</button><button id="dm" class="'+(demo?'on':'')+'">وضع تجريبي</button><button id="lo">خروج</button>'+(demo?'<span class="demo-flag">بيانات تجريبية مش حقيقية</span>':'')+'</div><div id="v"></div>';
  [].forEach.call(app.querySelectorAll('[data-v]'),function(b){b.onclick=function(){view=b.getAttribute('data-v');shell()}});
  document.getElementById('dm').onclick=function(){demo=!demo;shell()};document.getElementById('lo').onclick=logout;
  (view==='dash'?dash:view==='orders'?orders:view==='prods'?prods:view==='subs'?subs:view==='rets'?rets:cost)(document.getElementById('v'));
}
function dash(el){
  el.innerHTML='<div class="rowf"><label>من <input type="date" id="f"></label><label>إلى <input type="date" id="t"></label><button class="ad-btn" id="go">تحديث</button></div><div id="out">جاري التحميل...</div>';
  function run(){var f=document.getElementById('f').value,t=document.getElementById('t').value,out=document.getElementById('out');
   var p=demo?Promise.resolve(statsFrom(demoData(),f,t)):call('stats','GET',null,(f?'&from='+f:'')+(t?'&to='+t:''));
   p.then(function(s){if(s.error){out.textContent='مشكلة في التحميل';return}
    var prod={},col={},siz={},mon={},fun={};Object.keys(s.byProduct).forEach(function(k){prod[k]={l:s.byProduct[k].name,v:s.byProduct[k].qty}});
    Object.keys(s.byColor).forEach(function(k){col[k]={v:s.byColor[k]}});Object.keys(s.bySize).forEach(function(k){siz[k]={v:s.bySize[k]}});
    Object.keys(s.byMonth).sort().forEach(function(k){mon[k]={v:s.byMonth[k].revenue}});Object.keys(s.funnel).forEach(function(k){fun[k]={l:ST[k]||k,v:s.funnel[k]}});
    var pm={};Object.keys(s.byMonth).sort().forEach(function(k){pm[k]={v:Math.max(0,s.byMonth[k].profit)}});
    var q={};Object.keys(s.byMonth).forEach(function(k){var y=k.slice(0,4)+' Q'+(Math.floor((+k.slice(5)-1)/3)+1);q[y]=q[y]||{v:0};q[y].v+=s.byMonth[k].revenue});
    var y={};Object.keys(s.byMonth).forEach(function(k){var a=k.slice(0,4);y[a]=y[a]||{v:0};y[a].v+=s.byMonth[k].revenue});
    out.innerHTML='<div class="cards"><div class="kc"><span>عدد المبيعات</span><b>'+n(s.count)+'</b></div><div class="kc"><span>الإيراد (ج.م)</span><b>'+n(s.revenue)+'</b></div><div class="kc"><span>الربح (ج.م)</span><b>'+n(s.profit)+'</b></div><div class="kc"><span>الملغي</span><b>'+n(s.cancelled)+'</b></div></div>'+
     '<p class="msg" style="color:#7d7268">الربح = الإيراد − تكلفة القطع − رسوم الدفع − تكلفة الشحن علينا (الأخيرين من إعدادات السيرفر، حاليًا صفر).</p>'+
     '<div class="box"><h3>مسار الطلبات</h3>'+bars(fun)+'</div><div class="box"><h3>الأكثر مبيعًا (قطع)</h3>'+bars(prod)+'</div><div class="box"><h3>الألوان</h3>'+bars(col)+'</div><div class="box"><h3>المقاسات</h3>'+bars(siz)+'</div>'+
     '<div class="box"><h3>الإيراد الشهري</h3>'+bars(mon,n)+'</div><div class="box"><h3>الربح الشهري</h3>'+bars(pm,n)+'</div><div class="box"><h3>الإيراد ربع سنوي</h3>'+bars(q,n)+'</div><div class="box"><h3>الإيراد سنوي</h3>'+bars(y,n)+'</div>';
   }).catch(function(){})}
  document.getElementById('go').onclick=run;run();
}
function orders(el){
  el.innerHTML='جاري التحميل...';
  var p=demo?Promise.resolve({orders:demoData().slice(0,25).sort(function(a,b){return a.createdAt<b.createdAt?1:-1})}):call('orders','GET');
  p.then(function(j){var os=j.orders||[];if(!os.length){el.innerHTML='<p>مفيش طلبات لسه.</p>';return}
   el.innerHTML=os.map(function(o){var its=o.items.map(function(i){return esc(i.name)+' / '+esc(i.color)+' / '+esc(i.size)+' × '+i.qty}).join('<br>');
    return '<div class="ord" data-no="'+esc(o.orderNo)+'"><h4><span dir="ltr">'+esc(o.orderNo)+'</span> — '+esc(o.customer.name)+'</h4><div>'+new Date(o.createdAt).toLocaleString('ar-EG')+'</div><div>📞 <span dir="ltr">'+esc(o.customer.phone)+'</span></div><div>'+esc(o.shipping.governorate)+'، '+esc(o.shipping.area||'')+'، '+esc(o.shipping.address)+'</div><div style="margin:6px 0">'+its+'</div><div>الإجمالي: <b>'+n(o.total)+' ج.م</b> — الدفع: '+esc(o.payment.method)+' ('+esc(o.payment.status)+')</div>'+
     '<div class="rowf"><select class="st">'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(o.status===k?' selected':'')+'>'+ST[k]+'</option>'}).join('')+'</select><input class="cn" dir="ltr" placeholder="رقم شحنة شركة الشحن" value="'+esc(o.courierNo||'')+'"><button class="ad-btn sv">حفظ</button><span class="msg"></span></div></div>'}).join('');
   [].forEach.call(el.querySelectorAll('.ord'),function(d){d.querySelector('.sv').onclick=function(){var m=d.querySelector('.msg');
    if(demo){m.textContent='تجريبي: مش بيتحفظ';return}
    call('update','POST',{orderNo:d.getAttribute('data-no'),status:d.querySelector('.st').value,courierNo:d.querySelector('.cn').value}).then(function(r){m.style.color=r.ok?'#3a7a3a':'#a33';m.textContent=r.ok?'اتحفظ':'مشكلة'})}});
  }).catch(function(){});
}
function subs(el){
  if(demo){el.innerHTML='<p>مفيش مشتركين في الوضع التجريبي.</p>';return}
  el.innerHTML='جاري التحميل...';
  call('subscribers','GET').then(function(j){var l=j.subscribers||[];
    el.innerHTML='<div class="box"><h3>مشتركين النشرة: '+n(l.length)+'</h3><div class="rowf"><button class="ad-btn" id="cp">نسخ كل الإيميلات</button></div><div style="margin-top:10px;font-size:14px;direction:ltr;text-align:left">'+l.map(function(x){return '<div>'+esc(x._id)+' <span style="color:#7d7268;font-size:12px">'+esc(String(x.createdAt||'').slice(0,10))+'</span></div>'}).join('')+'</div></div>';
    document.getElementById('cp').onclick=function(){var t=l.map(function(x){return x._id}).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){document.getElementById('cp').textContent='اتنسخت'})}
  }).catch(function(){});
}

var RS={new:'جديد',contacted:'تم التواصل',approved:'مقبول',rejected:'مرفوض',received:'تم الاستلام',exchanged:'تم الاستبدال'};
var RR={size:'المقاس مش مناسب',color:'اللون مختلف',defect:'فيها عيب',notasdescribed:'مش زي الوصف',changed:'غيرت رأيها',other:'سبب تاني'};
function rets(el){
  if(demo){el.innerHTML='<p>مفيش طلبات في الوضع التجريبي.</p>';return}
  el.innerHTML='جاري التحميل...';
  call('returns','GET').then(function(j){var l=j.returns||[];
    if(!l.length){el.innerHTML='<div class="box">مفيش طلبات استرجاع لسه.</div>';return}
    el.innerHTML='<div class="box"><h3>طلبات الاسترجاع والاستبدال: '+n(l.length)+'</h3></div>'+l.map(function(r,k){var ph=String(r.customer&&r.customer.phone||''),wa=ph.replace(/^0/,'20').replace(/\D/g,'');
      return '<div class="ord"><h4>'+esc(r._id)+' · طلب <span dir="ltr">'+esc(r.orderNo)+'</span> · '+(r.type==='return'?'استرجاع':'استبدال')+'</h4>'+
      '<div>'+esc(r.customer&&r.customer.name)+' · <a href="tel:'+esc(ph)+'" dir="ltr">'+esc(ph)+'</a> · <a href="https://wa.me/'+esc(wa)+'" target="_blank" rel="noopener">واتساب</a></div>'+
      '<div>القطعة: '+esc(r.item&&r.item.name)+' / '+esc(r.item&&r.item.color)+' / '+esc(r.item&&r.item.size)+' × '+n(r.item&&r.item.qty)+'</div>'+
      '<div>السبب: '+esc(RR[r.reason]||r.reason)+(r.note?' — '+esc(r.note):'')+'</div>'+
      '<div style="font-size:12px;opacity:.7">'+esc(new Date(r.createdAt).toLocaleString('ar-EG'))+'</div>'+
      '<div class="rowf" style="margin-top:8px"><select id="rs'+k+'">'+Object.keys(RS).map(function(x){return '<option value="'+x+'"'+(x===r.status?' selected':'')+'>'+RS[x]+'</option>'}).join('')+'</select>'+
      '<input id="rh'+k+'" placeholder="مين اللي اتعامل" value="'+esc(r.handledBy||'')+'"></div>'+
      '<textarea id="rn'+k+'" rows="2" style="width:100%;margin-top:6px" placeholder="ملاحظات">'+esc(r.adminNotes||'')+'</textarea>'+
      '<button class="ad-btn" id="rb'+k+'">حفظ</button> <span id="rm'+k+'"></span></div>'}).join('');
    l.forEach(function(r,k){document.getElementById('rb'+k).onclick=function(){
      call('return-update','POST',{id:r._id,status:document.getElementById('rs'+k).value,adminNotes:document.getElementById('rn'+k).value,handledBy:document.getElementById('rh'+k).value}).then(function(x){document.getElementById('rm'+k).textContent=x.ok?'اتحفظ':'حصلت مشكلة';if(x.ok&&x.handledBy)document.getElementById('rh'+k).value=x.handledBy})}});
  }).catch(function(){});
}
function slugk(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function shrink(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    var W=900,sc=Math.min(1,W/im.width),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
    var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(im,0,0,w,h);
    var u=c.toDataURL('image/webp',0.84);if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/jpeg',0.88);
    cb(u)};im.onerror=function(){cb(null)};im.src=fr.result};
  fr.readAsDataURL(file);
}
function prods(el){
  if(demo){el.innerHTML='<p>المنتجات مش بتتعدل في الوضع التجريبي.</p>';return}
  el.innerHTML='جاري التحميل...';
  call('products','GET').then(function(j){
    var ps=j.products||[];
    el.innerHTML='<div class="rowf"><button class="ad-btn" id="np">+ منتج جديد</button></div><div id="pl">'+ps.map(function(p){
      return '<div class="ord"><h4>'+esc(p.name)+(p.active?'':' <span class="msg">(مخفي)</span>')+'</h4><div>'+n(p.price)+' ج.م · '+p.colors.map(function(c){return '<i style="display:inline-block;width:14px;height:14px;border:1px solid #999;background:'+esc(c.hex)+';vertical-align:middle"></i> '+esc(c.name)}).join(' ')+'</div><div class="rowf"><button class="ad-btn" data-e="'+esc(p.id)+'">تعديل</button></div></div>'}).join('')+'</div><div id="pf"></div>';
    document.getElementById('np').onclick=function(){pform(el,null,ps)};
    [].forEach.call(el.querySelectorAll('[data-e]'),function(b){b.onclick=function(){var id=b.getAttribute('data-e');pform(el,ps.filter(function(p){return p.id===id})[0],ps)}});
  }).catch(function(){});
}
function pform(el,p,ps){
  var isNew=!p;p=p||{id:'',name:'',nameEn:'',price:'',cost:0,desc:'',descEn:'',category:'shirts',active:true,isNew:false,sizes:['XS','S','M','L','XL'],colors:[{key:'',name:'',nameEn:'',hex:'#6b2335'}],images:{}};
  var pf=document.getElementById('pf');
  function crow(c,i){return '<div class="ord crow" data-key="'+esc(c.key)+'"><div class="rowf"><input class="cn1" placeholder="اسم اللون (عربي)" value="'+esc(c.name)+'"><input class="cn2" dir="ltr" placeholder="Color name (EN)" value="'+esc(c.nameEn)+'"><input class="ch" type="color" value="'+esc(c.hex)+'"></div><div class="rowf"><input class="cf" type="file" accept="image/*">'+(c.key&&p.images&&p.images[c.key]?'<img class="pv" style="height:70px" src="'+API+esc(p.images[c.key])+'">':(c.key?'<span class="msg" style="color:#7d7268">الصورة الحالية من الموقع، ارفعي صورة جديدة لو عايزة تغيّريها</span>':''))+'<button class="ad-btn cx" type="button">حذف اللون</button></div></div>'}
  pf.innerHTML='<div class="box"><h3>'+(isNew?'منتج جديد':'تعديل: '+esc(p.name))+'</h3>'
   +'<div class="fi" style="max-width:none;margin:0"><input id="f-n" placeholder="الاسم (عربي)" value="'+esc(p.name)+'"><input id="f-ne" dir="ltr" placeholder="Name (EN)" value="'+esc(p.nameEn)+'"><input id="f-p" type="number" min="0" dir="ltr" placeholder="السعر ج.م" value="'+esc(p.price)+'"><input id="f-c" type="number" min="0" dir="ltr" placeholder="تكلفة القطعة" value="'+esc(p.cost)+'"><textarea id="f-d" rows="3" placeholder="الوصف (عربي)" style="padding:8px;border:1px solid #cba85e;font:inherit">'+esc(p.desc)+'</textarea><textarea id="f-de" rows="3" dir="ltr" placeholder="Description (EN)" style="padding:8px;border:1px solid #cba85e;font:inherit">'+esc(p.descEn)+'</textarea><select id="f-k"><option value="shirts"'+(p.category==='shirts'?' selected':'')+'>قمصان وبلوزات</option><option value="tees"'+(p.category==='tees'?' selected':'')+'>تيشيرتات</option></select><input id="f-s" dir="ltr" placeholder="المقاسات: XS,S,M,L,XL" value="'+esc(p.sizes.join(','))+'"><label><input type="checkbox" id="f-a"'+(p.active?' checked':'')+'> ظاهر في الموقع</label><label><input type="checkbox" id="f-w"'+(p.isNew?' checked':'')+'> علامة "جديد"</label></div>'
   +'<h3 style="margin-top:14px">الألوان والصور</h3><div id="cl">'+p.colors.map(crow).join('')+'</div><div class="rowf"><button class="ad-btn" id="ac" type="button">+ لون</button></div>'
   +'<p class="msg" id="fm"></p><div class="rowf"><button class="ad-btn" id="fs" type="button">حفظ</button><button class="ad-btn" id="fc" type="button">إلغاء</button>'+(isNew?'':'<button class="ad-btn" id="fd" type="button" style="color:#a33">'+(['malika','shams','oud'].indexOf(p.id)>-1?'إخفاء المنتج':'حذف المنتج')+'</button>')+'</div></div>';
  pf.scrollIntoView({behavior:'smooth'});
  var cl=document.getElementById('cl'),fm=document.getElementById('fm');
  function bindX(){[].forEach.call(cl.querySelectorAll('.cx'),function(b){b.onclick=function(){if(cl.children.length>1)b.closest('.crow').remove()}})}
  bindX();
  document.getElementById('ac').onclick=function(){cl.insertAdjacentHTML('beforeend',crow({key:'',name:'',nameEn:'',hex:'#999999'}));bindX()};
  document.getElementById('fc').onclick=function(){pf.innerHTML=''};
  if(!isNew)document.getElementById('fd').onclick=function(){if(!confirm('متأكدة؟'))return;call('product-del','POST',{id:p.id}).then(function(){prods(el)})};
  document.getElementById('fs').onclick=function(){
    var rows=[].slice.call(cl.querySelectorAll('.crow')),cols=[],files=[];
    rows.forEach(function(r,i){var key=r.getAttribute('data-key')||('k'+Date.now().toString(36)+i);cols.push({key:key,name:r.querySelector('.cn1').value,nameEn:r.querySelector('.cn2').value,hex:r.querySelector('.ch').value});var f=r.querySelector('.cf').files[0];if(f)files.push([key,f])});
    var body={id:p.id,name:document.getElementById('f-n').value,nameEn:document.getElementById('f-ne').value,price:document.getElementById('f-p').value,cost:document.getElementById('f-c').value,desc:document.getElementById('f-d').value,descEn:document.getElementById('f-de').value,category:document.getElementById('f-k').value,sizes:document.getElementById('f-s').value.split(',').map(function(x){return x.trim()}).filter(Boolean),active:document.getElementById('f-a').checked,isNew:document.getElementById('f-w').checked,colors:cols};
    fm.style.color='#7d7268';fm.textContent='جاري الحفظ...';
    call('product-save','POST',body).then(function(r){
      if(!r.ok){fm.style.color='#a33';fm.textContent=({name_required:'الاسم مطلوب',bad_price:'السعر مش مظبوط',color_required:'ضيفي لون واحد على الأقل'})[r.error]||'مشكلة في الحفظ';return}
      var id=r.id,k=0;
      (function next(){
        if(k>=files.length){fm.style.color='#3a7a3a';fm.textContent='اتحفظ. الموقع هيتحدّث خلال دقيقة.';setTimeout(function(){prods(el)},900);return}
        var fk=files[k++];fm.textContent='جاري رفع الصورة '+k+' من '+files.length+'...';
        shrink(fk[1],function(u){if(!u){next();return}call('product-image','POST',{id:id,key:fk[0],data:u}).then(function(x){if(!x.ok){fm.style.color='#a33';fm.textContent='الصورة فشلت: '+(x.error||'')}next()}).catch(function(){fm.style.color='#a33';fm.textContent='الصورة فشلت'})});
      })();
    }).catch(function(){fm.style.color='#a33';fm.textContent='مشكلة في الاتصال'});
  };
}
function cost(el){
  if(demo){el.innerHTML='<p>التكلفة مش بتتعدل في الوضع التجريبي.</p>';return}
  el.innerHTML='جاري التحميل...';
  call('products','GET').then(function(j){var ps=j.products||[];
   el.innerHTML='<p class="msg" style="color:#7d7268">اكتبي تكلفة القطعة الواحدة (ج.م). بتتحسب في الربح للطلبات الجديدة بس.</p>'+ps.map(function(p){return '<div class="ord" data-id="'+esc(p.id)+'"><h4>'+esc(p.name)+'</h4><div>السعر: '+n(p.price)+' ج.م</div><div class="rowf"><input class="co" type="number" min="0" step="1" dir="ltr" value="'+(p.cost||0)+'"><button class="ad-btn sv">حفظ</button><span class="msg"></span></div></div>'}).join('');
   [].forEach.call(el.querySelectorAll('.ord'),function(d){d.querySelector('.sv').onclick=function(){var m=d.querySelector('.msg');call('cost','POST',{id:d.getAttribute('data-id'),cost:d.querySelector('.co').value}).then(function(r){m.style.color=r.ok?'#3a7a3a':'#a33';m.textContent=r.ok?'اتحفظ':'مشكلة'})}});
  }).catch(function(){});
}
if(tok)shell();else login();
})();
</script>
</body>
